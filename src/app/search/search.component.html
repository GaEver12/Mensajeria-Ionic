<ion-header>
  <ion-toolbar>
    <ion-title>Usuarios</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()" [strong]="true">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-searchbar [(ngModel)]="caracterBusqueda" (ionInput)="filtrarUsuarios()"
      placeholder="Buscar por nombre">
    </ion-searchbar>
    <ion-item *ngFor="let user of usuariosFiltrados " (click)="seleccionarUsuario(user)">
      {{ user.name }}
    </ion-item>
  </ion-list>
</ion-content>
