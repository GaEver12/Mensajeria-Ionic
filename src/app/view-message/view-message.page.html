<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        [text]="getBackButtonText()"
        defaultHref="/"
      ></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
@if (message()) {
  <ion-content [fullscreen]="true">
    <ion-item>
      <ion-icon
        aria-hidden="true"
        name="person-circle"
        color="primary"
      ></ion-icon>
      <ion-label class="ion-text-wrap">

      
      <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
        <ng-template>
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-button (click)="cancel()">Cerrar</ion-button>
              </ion-buttons>
              <ion-title>Imagen</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="image-modal-content" scroll-y="false">
            <img [src]="message()!.urlImg" alt="Imagen" class="modal-image" />
          </ion-content>
        </ng-template>
      </ion-modal>

        <h2>
          {{ message()!.fromName }}
          <span class="date">
            <ion-note>{{ message()!.date }}</ion-note>
          </span>
        </h2>
        <h3>To: <ion-note>Me</ion-note></h3>
      </ion-label>
    </ion-item>

    <ion-chip id="open-modal" [style.display]="message()!.urlImg ? 'inline-flex' : 'none'">
      <ion-icon name="image-outline" color="primary"></ion-icon>
      <ion-label style="margin: 0 !important;">Imagen</ion-label>
    </ion-chip>

    <div class="ion-padding">
      <h1>{{ message()!.subject }}</h1>
      <p>
        {{ message()!.message }}
      </p>
    </div>
  </ion-content>
}
